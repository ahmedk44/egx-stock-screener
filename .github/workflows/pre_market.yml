name: Pre-Market News Scan

on:
  # PRIMARY: Vercel Cron 30 5 * * 0-4 -> /api/pre_market (verified firing via news_publish_log).
  # GHA schedule restored 2026-09-02 as REDUNDANT fallback, staggered +15m after Vercel.
  # Cross-platform idempotency: Supabase news_publish_log (check_already_published) skips if Vercel already published.
  schedule:
    - cron: "45 5 * * 0-4" # 05:45 UTC (08:45 Cairo) Sun-Thu — 15m after Vercel 05:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-pre-market
  cancel-in-progress: false

jobs:
  scan:
    name: Pre-market catalyst watchlist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-market scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_NEWS: ${{ secrets.TELEGRAM_CHANNEL_NEWS }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
          TELEGRAM_CHANNEL_SCALP: ${{ secrets.TELEGRAM_CHANNEL_SCALP }}
          TELEGRAM_CHANNEL_SWING: ${{ secrets.TELEGRAM_CHANNEL_SWING }}
          TELEGRAM_CHANNEL_INVEST: ${{ secrets.TELEGRAM_CHANNEL_INVEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANNEL_SCALPING: ${{ secrets.CHANNEL_SCALPING }}
          CHANNEL_SWING: ${{ secrets.CHANNEL_SWING }}
          CHANNEL_INVESTMENT: ${{ secrets.CHANNEL_INVESTMENT }}
        run: |
          echo "Running EGX Pre-Market Briefing (EGX News & Market Summaries)"
          python -m egx_quant.news.pre_market_briefing || python egx_quant/news/pre_market_briefing.py || python main.py --mode=pre_market

      - name: Persist Active Positions State
        continue-on-error: true # best-effort state persistence — must not fail the run
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add active_positions.json || true
          if git diff --staged --quiet; then
            echo "No changes in active_positions.json to commit."
          else
            git commit -m "chore: auto-update active positions state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi