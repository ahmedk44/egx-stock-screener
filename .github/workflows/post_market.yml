name: Post-Market News Scan

on:
  # schedule: DISABLED — migrated to Vercel Cron / cron-job.org (see vercel.json crons & scripts/setup_cronjobs.py)
  # Previous: 30 12 * * 0-4 → 12:30 UTC (15:30 Cairo / 16:30 Oman Sun-Thu) — now triggers via https://.../api/cron/post_market
  # Keeping workflow_dispatch for manual runs only (prevents double-posting & GH queue delays). Vercel Cron is primary; GH queue caused 4.5h delay (Created 12:31 → Started 16:48).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-post-market
  cancel-in-progress: false

jobs:
  scan:
    name: Post-market news summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log execution window (UTC vs scheduled)
        run: |
          echo "=== Post-Market Timestamp Audit ==="
          echo "Scheduled: 12:30 UTC (15:30 Cairo / 16:30 Oman) Sun-Thu — cron '30 12 * * 0-4'"
          echo "Runner UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner Cairo: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Runner Oman: $(TZ='Asia/Muscat' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          # Created vs Started: GH logs Created at (queued) vs Started at (runner picked). Delay >60m indicates queue saturation.
          env | grep -E "GITHUB_(RUN|EVENT|REPOSITORY)" | sort || true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (light, cached)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --prefer-binary -r requirements.txt --quiet

      - name: Run post-market scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_NEWS: ${{ secrets.TELEGRAM_CHANNEL_NEWS }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
          TELEGRAM_CHANNEL_SCALP: ${{ secrets.TELEGRAM_CHANNEL_SCALP }}
          TELEGRAM_CHANNEL_SWING: ${{ secrets.TELEGRAM_CHANNEL_SWING }}
          TELEGRAM_CHANNEL_INVEST: ${{ secrets.TELEGRAM_CHANNEL_INVEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANNEL_SCALPING: ${{ secrets.CHANNEL_SCALPING }}
          CHANNEL_SWING: ${{ secrets.CHANNEL_SWING }}
          CHANNEL_INVESTMENT: ${{ secrets.CHANNEL_INVESTMENT }}
        run: |
          echo "Running EGX Post-Market Bulletin (EGX News & Market Summaries)"
          python -m egx_quant.news.post_market_summary || python egx_quant/news/post_market_summary.py || python main.py --mode=post_market

      - name: Persist Active Positions State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add active_positions.json || true
          if git diff --staged --quiet; then
            echo "No changes in active_positions.json to commit."
          else
            git commit -m "chore: auto-update active positions state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi