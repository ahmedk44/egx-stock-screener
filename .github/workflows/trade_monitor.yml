name: Real-Time Target & SL Monitor

on:
  # BACKUP SCHEDULE (re-enabled 2026-09-14): cron-job.org may fail silently.
  # This runs every 15 minutes as fallback during EGX session.
  # Primary schedule is cron-job.org */5 — see scripts/setup_cronjobs.py.
  schedule:
    - cron: "*/15 6-12 * * 0-4"  # Every 15 min, 06:00-12:00 UTC (09:00-15:00 Cairo) Sun-Thu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-trade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Target & SL Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run target & SL monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_NEWS: ${{ secrets.TELEGRAM_CHANNEL_NEWS }}
          TELEGRAM_CHANNEL_SCALP: ${{ secrets.TELEGRAM_CHANNEL_SCALP }}
          TELEGRAM_CHANNEL_SWING: ${{ secrets.TELEGRAM_CHANNEL_SWING }}
          TELEGRAM_CHANNEL_INVEST: ${{ secrets.TELEGRAM_CHANNEL_INVEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANNEL_SCALPING: ${{ secrets.CHANNEL_SCALPING }}
          CHANNEL_SWING: ${{ secrets.CHANNEL_SWING }}
          CHANNEL_INVESTMENT: ${{ secrets.CHANNEL_INVESTMENT }}
        run: |
          echo "Running EGX Trade Monitor - Target & SL Check"
          python -m egx_quant.engine.trade_monitor || python egx_quant/engine/trade_monitor.py

      - name: Persist monitor state
        continue-on-error: true # best-effort state persistence — must not fail the run
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_alerts.json || true
          if git diff --staged --quiet; then
            echo "No changes in sent_alerts.json"
          else
            git commit -m "chore: update sent alerts state [skip ci]"
            git pull origin main --rebase || true
            git push origin main || true
          fi