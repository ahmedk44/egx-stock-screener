name: EGX Stock Screener

on:
  # BACKUP SCHEDULE: cron-job.org */15 is primary — see scripts/setup_cronjobs.py.
  # GitHub runs at :20 (not :30) and STOPS at 10:20 UTC (13:20 Cairo) leaving a
  # 70-min buffer before the 12:30 UTC post-market bulletin, so delayed queue
  # runs can never emit signals AFTER the close summary. The in-code market
  # gate (main.py) double-guards this.
  schedule:
    - cron: "20 7,8,9,10 * * 0-4"  # 07:20-10:20 UTC (10:20-13:20 Cairo) Sun-Thu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-screener
  cancel-in-progress: false

jobs:
  screen:
    name: Scan EGX & send alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_NEWS: ${{ secrets.TELEGRAM_CHANNEL_NEWS }}
          TELEGRAM_CHANNEL_SCALP: ${{ secrets.TELEGRAM_CHANNEL_SCALP }}
          TELEGRAM_CHANNEL_SWING: ${{ secrets.TELEGRAM_CHANNEL_SWING }}
          TELEGRAM_CHANNEL_INVEST: ${{ secrets.TELEGRAM_CHANNEL_INVEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
          CHANNEL_SCALPING: ${{ secrets.CHANNEL_SCALPING }}
          CHANNEL_SWING: ${{ secrets.CHANNEL_SWING }}
          CHANNEL_INVESTMENT: ${{ secrets.CHANNEL_INVESTMENT }}
        run: python main.py

      - name: Persist Active Positions State
        continue-on-error: true # best-effort state persistence — must not fail the run (GH push races caused the 08/30 failure)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add active_positions.json || true
          if git diff --staged --quiet; then
            echo "No changes in active_positions.json to commit."
          else
            git commit -m "chore: auto-update active positions state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi

      - name: Commit updated state back to repo
        continue-on-error: true # best-effort state persistence — must not fail the run
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          if git diff --staged --quiet; then
            echo "No changes in state.json to commit."
          else
            git commit -m "chore: update screener state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi