name: EGX Stock Screener

on:
  # INTRADAY SCANNER SCHEDULE REMOVED FROM GITHUB ACTIONS (2026-09-03): GHA is
  # unreliable for intraday scalping latency. The */15 trigger now runs EXCLUSIVELY
  # via the external cron-job.org schedule (see scripts/setup_cronjobs.py — 15-min
  # pings to /api/scanner, 07:00-11:30 UTC / 10:00-14:30 Cairo Sun-Thu).
  # NOTE: vercel.json crons cannot host */15 on the Hobby plan (daily-only crons);
  # re-add there after a Pro upgrade if Vercel-native scheduling is wanted.
  # Dedup: scanner publishes are per-ticker upserts in Supabase; main.py dedups via state.json.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-screener
  cancel-in-progress: false

jobs:
  screen:
    name: Scan EGX & send alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_NEWS: ${{ secrets.TELEGRAM_CHANNEL_NEWS }}
          TELEGRAM_CHANNEL_SCALP: ${{ secrets.TELEGRAM_CHANNEL_SCALP }}
          TELEGRAM_CHANNEL_SWING: ${{ secrets.TELEGRAM_CHANNEL_SWING }}
          TELEGRAM_CHANNEL_INVEST: ${{ secrets.TELEGRAM_CHANNEL_INVEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
          CHANNEL_SCALPING: ${{ secrets.CHANNEL_SCALPING }}
          CHANNEL_SWING: ${{ secrets.CHANNEL_SWING }}
          CHANNEL_INVESTMENT: ${{ secrets.CHANNEL_INVESTMENT }}
        run: python main.py

      - name: Persist Active Positions State
        continue-on-error: true # best-effort state persistence — must not fail the run (GH push races caused the 08/30 failure)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add active_positions.json || true
          if git diff --staged --quiet; then
            echo "No changes in active_positions.json to commit."
          else
            git commit -m "chore: auto-update active positions state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi

      - name: Commit updated state back to repo
        continue-on-error: true # best-effort state persistence — must not fail the run
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          if git diff --staged --quiet; then
            echo "No changes in state.json to commit."
          else
            git commit -m "chore: update screener state [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi